name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - name: Restore licensed webfont
        shell: bash
        env:
          FONT_ARCHIVE_PASSPHRASE: ${{ secrets.FONT_ARCHIVE_PASSPHRASE }}
        run: |
          printf '%s\n' "$FONT_ARCHIVE_PASSPHRASE" |
            gpg --batch --pinentry-mode loopback --passphrase-fd 0 --decrypt assets/fonts/fonts.tar.gpg |
            tar -xf - -C assets/fonts henrietta.woff2
      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_DOWNLOAD_URL: ${{ vars.VITE_DOWNLOAD_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
