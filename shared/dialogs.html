<dialog id="lightbox" class="lightbox" aria-labelledby="lightbox-title" aria-describedby="capture-caption">
  <div class="dialog-bar">
    <h2 id="lightbox-title">Syphon screenshot</h2>
    <button type="button" data-close autofocus>Close</button>
  </div>
  <div class="image-scroll" tabindex="0" role="region" aria-label="Enlarged Syphon screenshot">
  </div>
  <div class="lightbox-foot"><p id="capture-caption"></p><button type="button" data-zoom aria-pressed="false">Zoom in</button></div>
</dialog>
